name: IndexNow URL Submission

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  submit-indexnow:
    name: Submit URLs to Bing IndexNow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for Vercel deployment to be live
        run: sleep 30

      - name: Submit all URLs to IndexNow (Bing)
        run: node indexnow-submit.js
